[versions]
agp = "9.5.2"
kotlin = "2.4.21"
compileSdk = "37"
compileSdkMinor = "1"
targetSdk = "30"
minSdk = "26"

appcompat = "1.8.0"
preference = "1.1.1"
material = "1.14.0"
work = "2.12.0"
securityCrypto = "1.0.0"
browser = "1.3.0"
swiperefreshlayout = "1.2.0"
documentfile = "1.1.0"
jsoup = "1.11.3"
okhttp = "4.9.1"
cookieStore = "1.3.5"
gson = "2.9.0"
glide = "4.12.0"
jobqueue = "3.0.0"
eventbus = "3.0.0"
subsamplingScaleImageView = "3.10.0"
materialdrawer = "6.1.2"
iconicsCore = "3.2.1"
googleMaterialTypeface = "2.2.0.2.original"
fontawesomeTypeface = "4.6.0.2"
bubbleLayout = "v1.2.1"
emojiJava = "3.1.3"
calligraphy3 = "3.1.1"
viewpump = "2.0.3"
compressor = "2.1.1"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor" }
cookie-store = { module = "net.gotev:cookie-store", version.ref = "cookieStore" }
cookie-store-okhttp = { module = "net.gotev:cookie-store-okhttp", version.ref = "cookieStore" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-okhttp3-integration = { module = "com.github.bumptech.glide:okhttp3-integration", version.ref = "glide" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }

android-priority-jobqueue = { module = "com.birbit:android-priority-jobqueue", version.ref = "jobqueue" }
eventbus = { module = "org.greenrobot:eventbus", version.ref = "eventbus" }
subsampling-scale-image-view = { module = "com.davemorrissey.labs:subsampling-scale-image-view-androidx", version.ref = "subsamplingScaleImageView" }

materialdrawer = { module = "com.mikepenz:materialdrawer", version.ref = "materialdrawer" }
iconics-core = { module = "com.mikepenz:iconics-core", version.ref = "iconicsCore" }
google-material-typeface = { module = "com.mikepenz:google-material-typeface", version.ref = "googleMaterialTypeface" }
fontawesome-typeface = { module = "com.mikepenz:fontawesome-typeface", version.ref = "fontawesomeTypeface" }

bubble-layout = { module = "com.github.MasayukiSuda:BubbleLayout", version.ref = "bubbleLayout" }
emoji-java = { module = "com.vdurmont:emoji-java", version.ref = "emojiJava" }
calligraphy3 = { module = "io.github.inflationx:calligraphy3", version.ref = "calligraphy3" }
viewpump = { module = "io.github.inflationx:viewpump", version.ref = "viewpump" }
compressor = { module = "id.zelory:compressor", version.ref = "compressor" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
