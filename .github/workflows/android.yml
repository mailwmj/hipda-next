name: Android CI

on:
  push:
    branches:
      - main
      - 'card/**'
  pull_request:
  workflow_dispatch:
    inputs:
      emulator:
        description: 'Run API 36 emulator smoke test'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build, lint, and run unit tests
        run: ./gradlew assembleDebug assembleRelease lintDebug testDebugUnitTest --stacktrace

      - name: Verify APK outputs
        run: |
          ls -la hipda/build/outputs/apk/debug/ hipda/build/outputs/apk/release/
          test -f hipda/build/outputs/apk/release/hipda-ng-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: hipda/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: hipda/build/outputs/apk/release/hipda-ng-release.apk
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            hipda/build/reports/lint-results-debug.*
            emoji/build/reports/lint-results-debug.*
          if-no-files-found: warn

  emulator-smoke:
    name: Emulator Smoke Test (API 36)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.emulator == true || inputs.emulator == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: debug-apk
          path: artifacts/debug

      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: artifacts/release

      - name: Sign release APK with CI-only debug keystore
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          keytool -genkeypair -v \
            -keystore /tmp/ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 \
            artifacts/release/hipda-ng-release.apk \
            /tmp/hipda-ng-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks /tmp/ci-debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out artifacts/release/hipda-ng-release-signed.apk \
            /tmp/hipda-ng-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose artifacts/release/hipda-ng-release-signed.apk
          rm -f /tmp/ci-debug.keystore /tmp/hipda-ng-release-aligned.apk

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare smoke test script
        run: |
          cat <<'EOF' > /tmp/run-smoke.sh
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p smoke-artifacts

          run_variant_smoke() {
            local variant="$1"
            local apk_path="$2"
            echo "=== Smoke testing [$variant]: $apk_path ==="
            test -n "$apk_path"
            test -f "$apk_path"

            adb uninstall net.jejer.hipda.ng || true
            adb logcat -c
            adb install -r "$apk_path"
            adb shell am start -W -n net.jejer.hipda.ng/net.jejer.hipda.ui.MainFrameActivity
            sleep 15

            local log_file="smoke-artifacts/logcat-${variant}.txt"
            local png_file="smoke-artifacts/main-activity-${variant}.png"
            adb logcat -d > "$log_file"
            adb exec-out screencap -p > "$png_file"
            ls -lh "$log_file" "$png_file"
            test -s "$png_file"

            local failed=0
            if grep -n -A 5 "FATAL EXCEPTION" "$log_file" | grep -q "net\.jejer\.hipda"; then
              echo "ERROR [$variant]: Found FATAL EXCEPTION for net.jejer.hipda in logcat!"
              grep -n -A 40 "FATAL EXCEPTION" "$log_file"
              failed=1
            fi

            if grep -n "ANR in net\.jejer\.hipda\.ng" "$log_file"; then
              echo "ERROR [$variant]: Found ANR for net.jejer.hipda.ng in logcat!"
              grep -n -A 20 "ANR in net\.jejer\.hipda\.ng" "$log_file"
              failed=1
            fi

            local pid
            pid=$(adb shell pidof net.jejer.hipda.ng | tr -d '\r' || true)
            echo "[$variant] App PID: ${pid:-<not running>}"
            if [ -z "$pid" ]; then
              echo "ERROR [$variant]: net.jejer.hipda.ng process is not running!"
              if [ "$failed" -eq 0 ]; then
                tail -n 100 "$log_file"
              fi
              failed=1
            fi

            if [ "$failed" -ne 0 ]; then
              return 1
            fi
            echo "Smoke check passed [$variant]: PID=$pid, no app FATAL EXCEPTION or ANR in logcat."
          }

          DEBUG_APK=$(find artifacts/debug -name "*.apk" | head -n 1)
          RELEASE_APK="artifacts/release/hipda-ng-release-signed.apk"

          run_variant_smoke debug "$DEBUG_APK"
          run_variant_smoke release "$RELEASE_APK"
          EOF
          chmod +x /tmp/run-smoke.sh

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: /tmp/run-smoke.sh

      - name: Upload emulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke-artifacts
          path: smoke-artifacts/
          if-no-files-found: warn
