name: Android CI

on:
  push:
    branches:
      - main
      - 'card/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      emulator:
        description: 'Run API 36 emulator smoke test'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build and lint
        run: ./gradlew assembleDebug assembleRelease :verify-smoke:assembleDebug lintDebug --stacktrace

      - name: Verify Room schema consistency
        run: |
          set -euo pipefail
          untracked=$(git ls-files --others --exclude-standard -- hipda/schemas/)
          diff_failed=0
          if ! git diff --exit-code -- hipda/schemas/; then
            diff_failed=1
          fi
          if [ "$diff_failed" -ne 0 ] || [ -n "$untracked" ]; then
            echo "::error::改了 Room 实体但没有提交新的 schema 文件，或忘了升版本。"
            if [ -n "$untracked" ]; then
              echo "未提交的新 schema 文件："
              echo "$untracked"
            fi
            exit 1
          fi

      - name: Run unit tests and verify Roborazzi screenshots
        id: unit_tests
        run: ./gradlew testDebugUnitTest :core-parser:test -Proborazzi.test.verify=true --continue --stacktrace

      - name: Check for Roborazzi diff images
        id: roborazzi_diffs
        if: failure() && steps.unit_tests.outcome == 'failure'
        run: |
          set -euo pipefail
          if [ -d hipda/build/outputs/roborazzi ] && [ -n "$(find hipda/build/outputs/roborazzi -type f \( -name '*_compare.*' -o -name '*_actual.*' \) -print -quit)" ]; then
            echo "has_diffs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diffs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Roborazzi diff artifacts on failure
        if: failure() && steps.roborazzi_diffs.outputs.has_diffs == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-diffs
          path: |
            hipda/build/outputs/roborazzi/
            hipda/build/reports/roborazzi/
          if-no-files-found: warn

      - name: Verify APK outputs
        run: |
          set -euo pipefail
          ls -la hipda/build/outputs/apk/debug/ hipda/build/outputs/apk/release/
          test -f hipda/build/outputs/apk/release/hipda-ng-release.apk
          BUILD_TOOLS_DIR=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          DEBUG_BADGING=$("$BUILD_TOOLS_DIR/aapt2" dump badging hipda/build/outputs/apk/debug/hipda-debug.apk)
          RELEASE_BADGING=$("$BUILD_TOOLS_DIR/aapt2" dump badging hipda/build/outputs/apk/release/hipda-ng-release.apk)
          echo "=== aapt2 dump badging (debug) ==="
          grep -E "^package:|^sdkVersion:|^targetSdkVersion:" <<< "$DEBUG_BADGING"
          echo "=== aapt2 dump badging (release) ==="
          grep -E "^package:|^sdkVersion:|^targetSdkVersion:" <<< "$RELEASE_BADGING"
          grep -q "^package: name='net.jejer.hipda.next'" <<< "$DEBUG_BADGING"
          grep -q "^package: name='net.jejer.hipda.next'" <<< "$RELEASE_BADGING"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: hipda/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: hipda/build/outputs/apk/release/hipda-ng-release.apk
          if-no-files-found: error

      - name: Upload verify-smoke instrumentation APK
        uses: actions/upload-artifact@v7
        with:
          name: verify-smoke-apk
          path: verify-smoke/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            hipda/build/reports/lint-results-debug.*
            emoji/build/reports/lint-results-debug.*
          if-no-files-found: warn

      - name: Summarize unit test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob("**/build/test-results/**/*.xml", recursive=True))
          if not files:
              print("No JUnit XML test result files found.")
              raise SystemExit(0)
          total_tests = total_fail = total_err = total_skip = parse_errors = 0
          print("=== Unit Test Summary (JUnit XML) ===")
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  parse_errors += 1
                  print(f"::warning file={path}::Failed to parse JUnit XML {path}: {exc}")
                  continue
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              for s in suites:
                  name = s.attrib.get("name", path)
                  tests = int(s.attrib.get("tests", 0))
                  failures = int(s.attrib.get("failures", 0))
                  errors = int(s.attrib.get("errors", 0))
                  skipped = int(s.attrib.get("skipped", 0))
                  passed = tests - failures - errors - skipped
                  total_tests += tests
                  total_fail += failures
                  total_err += errors
                  total_skip += skipped
                  print(f"  {name}: {tests} tests, {passed} passed, {failures} failed, {errors} errors, {skipped} skipped")
          total_pass = total_tests - total_fail - total_err - total_skip
          print(f"TOTAL: {total_tests} tests, {total_pass} passed, {total_fail} failed, {total_err} errors, {total_skip} skipped")
          if parse_errors:
              print(f"WARNINGS: skipped {parse_errors} malformed JUnit XML file(s)")
          PY

      - name: Upload unit test results and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn

  emulator-smoke:
    name: Emulator Smoke Test (API 36)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.emulator == true || inputs.emulator == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: debug-apk
          path: artifacts/debug

      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: artifacts/release

      - name: Download verify-smoke instrumentation APK
        uses: actions/download-artifact@v8
        with:
          name: verify-smoke-apk
          path: artifacts/verify-smoke

      - name: Sign release APK with CI-only debug keystore
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          keytool -genkeypair -v \
            -keystore /tmp/ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 \
            artifacts/release/hipda-ng-release.apk \
            /tmp/hipda-ng-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks /tmp/ci-debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out artifacts/release/hipda-ng-release-signed.apk \
            /tmp/hipda-ng-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose artifacts/release/hipda-ng-release-signed.apk
          rm -f /tmp/ci-debug.keystore /tmp/hipda-ng-release-aligned.apk

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare smoke test script
        run: |
          cat <<'EOF' > /tmp/run-smoke.sh
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p smoke-artifacts

          # Keep emulator offline externally so neither debug nor release ever hits live 4d4y.com.
          adb shell cmd connectivity airplane-mode enable || true
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          sleep 2
          adb logcat -G 16M || true

          check_logcat_errors() {
            local variant="$1"
            local log_file="$2"
            local failed=0
            if { grep -n -A 5 "FATAL EXCEPTION" "$log_file" || true; } | grep -q "net\.jejer\.hipda"; then
              echo "ERROR [$variant]: Found FATAL EXCEPTION for net.jejer.hipda in logcat!"
              grep -n -A 40 "FATAL EXCEPTION" "$log_file" || true
              failed=1
            fi
            if grep -n "ANR in net\.jejer\.hipda\.next" "$log_file"; then
              echo "ERROR [$variant]: Found ANR for net.jejer.hipda.next in logcat!"
              grep -n -A 20 "ANR in net\.jejer\.hipda\.next" "$log_file" || true
              failed=1
            fi
            if { grep -n -E "ClassNotFoundException|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|SerializationException|MissingFieldException" "$log_file" || true; } | grep -qiE "hipda|kyant|serializer|NotificationPollingWorker|Hilt"; then
              echo "ERROR [$variant]: Found class/method/serializer error in logcat!"
              grep -n -E "ClassNotFoundException|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|SerializationException|MissingFieldException" "$log_file" || true
              failed=1
            fi
            return "$failed"
          }

          run_variant_smoke() {
            local variant="$1"
            local apk_path="$2"
            echo "=== Smoke testing [$variant]: $apk_path ==="
            test -n "$apk_path"
            test -f "$apk_path"

            adb uninstall net.jejer.hipda.next || true
            adb logcat -c
            adb install -r "$apk_path"
            adb shell am start -W -n net.jejer.hipda.next/net.jejer.hipda.feature.app.MainActivity
            sleep 12

            local log_file="smoke-artifacts/logcat-${variant}.txt"
            local png_file="smoke-artifacts/main-activity-${variant}.png"
            adb logcat -d > "$log_file"
            adb exec-out screencap -p > "$png_file"
            ls -lh "$log_file" "$png_file"
            test -s "$png_file"
            check_logcat_errors "$variant" "$log_file"

            local pid
            pid=$(adb shell pidof net.jejer.hipda.next | tr -d '\r' || true)
            echo "[$variant] App PID: ${pid:-<not running>}"
            test -n "$pid"
            echo "Smoke check passed [$variant]: PID=$pid, no app FATAL/ANR/reflection/serializer errors."
          }

          run_release_full_walkthrough() {
            local release_apk="$1"
            local smoke_apk="$2"
            echo "=== Full-screen UIAutomator Walkthrough [release]: $release_apk (probe=$smoke_apk) ==="
            test -f "$release_apk"
            test -f "$smoke_apk"

            adb uninstall net.jejer.hipda.next || true
            adb uninstall net.jejer.hipda.verifysmoke || true
            adb logcat -c
            adb install -r "$release_apk"
            adb install -r "$smoke_apk"

            local instr_log="smoke-artifacts/instrumentation-release.log"
            set +e
            adb shell am instrument -w -r \
              -e class net.jejer.hipda.verifysmoke.FullScreenReleaseSmokeTest \
              net.jejer.hipda.verifysmoke/androidx.test.runner.AndroidJUnitRunner \
              | tee "$instr_log"
            local rc=${PIPESTATUS[0]}
            set -e

            adb logcat -d > smoke-artifacts/logcat-release.txt
            adb pull /sdcard/Android/data/net.jejer.hipda.verifysmoke/files/smoke-artifacts/. smoke-artifacts/ || true
            ls -lh smoke-artifacts/

            if [ "$rc" -ne 0 ] || grep -q "FAILURES!!!" "$instr_log"; then
              echo "ERROR [release-walkthrough]: Instrumentation probe failed (rc=$rc)"
              cat "$instr_log"
              tail -n 150 smoke-artifacts/logcat-release.txt || true
              return 1
            fi

            check_logcat_errors release smoke-artifacts/logcat-release.txt
            test -s smoke-artifacts/smoke-summary.txt
            echo "=== Release Walkthrough Summary ==="
            cat smoke-artifacts/smoke-summary.txt
          }

          DEBUG_APK=$(find artifacts/debug -name "*.apk" | sort | awk 'NR==1{print}')
          RELEASE_APK="artifacts/release/hipda-ng-release-signed.apk"
          SMOKE_APK=$(find artifacts/verify-smoke -name "*.apk" | sort | awk 'NR==1{print}')

          run_variant_smoke debug "$DEBUG_APK"
          run_release_full_walkthrough "$RELEASE_APK" "$SMOKE_APK"
          EOF
          chmod +x /tmp/run-smoke.sh

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: /tmp/run-smoke.sh

      - name: Upload emulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke-artifacts
          path: smoke-artifacts/
          if-no-files-found: warn
