name: Android CI

on:
  push:
    branches:
      - main
      - 'card/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      emulator:
        description: 'Run API 36 emulator smoke test'
        required: false
        default: false
        type: boolean
      generate_baseline_profile:
        description: 'Generate Baseline Profile on API 36 emulator'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build and lint
        run: ./gradlew assembleDebug assembleRelease :baselineprofile:assembleNonMinifiedRelease lintDebug --stacktrace

      - name: Verify Room schema consistency
        run: |
          set -euo pipefail
          untracked=$(git ls-files --others --exclude-standard -- hipda/schemas/)
          diff_failed=0
          if ! git diff --exit-code -- hipda/schemas/; then
            diff_failed=1
          fi
          if [ "$diff_failed" -ne 0 ] || [ -n "$untracked" ]; then
            echo "::error::改了 Room 实体但没有提交新的 schema 文件，或忘了升版本。"
            if [ -n "$untracked" ]; then
              echo "未提交的新 schema 文件："
              echo "$untracked"
            fi
            exit 1
          fi

      - name: Run unit tests and verify Roborazzi screenshots
        id: unit_tests
        run: ./gradlew testDebugUnitTest :core-parser:test -Proborazzi.test.verify=true --continue --stacktrace

      - name: Check for Roborazzi diff images
        id: roborazzi_diffs
        if: failure() && steps.unit_tests.outcome == 'failure'
        run: |
          set -euo pipefail
          if [ -d hipda/build/outputs/roborazzi ] && [ -n "$(find hipda/build/outputs/roborazzi -type f \( -name '*_compare.*' -o -name '*_actual.*' \) -print -quit)" ]; then
            echo "has_diffs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diffs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Roborazzi diff artifacts on failure
        if: failure() && steps.roborazzi_diffs.outputs.has_diffs == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-diffs
          path: |
            hipda/build/outputs/roborazzi/
            hipda/build/reports/roborazzi/
          if-no-files-found: warn

      - name: Verify APK outputs
        run: |
          set -euo pipefail
          ls -la hipda/build/outputs/apk/debug/ hipda/build/outputs/apk/release/
          test -f hipda/build/outputs/apk/release/hipda-ng-release.apk
          BUILD_TOOLS_DIR=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          DEBUG_BADGING=$("$BUILD_TOOLS_DIR/aapt2" dump badging hipda/build/outputs/apk/debug/hipda-debug.apk)
          RELEASE_BADGING=$("$BUILD_TOOLS_DIR/aapt2" dump badging hipda/build/outputs/apk/release/hipda-ng-release.apk)
          echo "=== aapt2 dump badging (debug) ==="
          grep -E "^package:|^sdkVersion:|^targetSdkVersion:" <<< "$DEBUG_BADGING"
          echo "=== aapt2 dump badging (release) ==="
          grep -E "^package:|^sdkVersion:|^targetSdkVersion:" <<< "$RELEASE_BADGING"
          grep -q "^package: name='net.jejer.hipda.next'" <<< "$DEBUG_BADGING"
          grep -q "^package: name='net.jejer.hipda.next'" <<< "$RELEASE_BADGING"
          echo "=== Verify Baseline Profile & shrunk emoji resources in release APK ==="
          if "$BUILD_TOOLS_DIR/aapt2" dump xmltree hipda/build/outputs/apk/release/hipda-ng-release.apk --file AndroidManifest.xml | grep -q "BaselineProfileHostActivity"; then
            echo "::error::BaselineProfileHostActivity leaked into release APK manifest!"
            exit 1
          fi
          python3 - "$BUILD_TOOLS_DIR/aapt2" hipda/build/outputs/apk/release/hipda-ng-release.apk <<'PY'
          import glob, os, re, subprocess, sys, zipfile
          aapt2, apk_path = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(apk_path) as zf:
              for entry in ("assets/dexopt/baseline.prof", "assets/dexopt/baseline.profm"):
                  info = zf.getinfo(entry)
                  assert info.file_size > 0, f"{entry} is empty"
                  print(f"OK {entry}: {info.file_size} bytes")
              dump = subprocess.check_output([aapt2, "dump", "resources", apk_path], text=True)
              res_paths = {}
              current = None
              for line in dump.splitlines():
                  m = re.search(r"resource 0x[0-9a-f]+ ([A-Za-z0-9_]+/[A-Za-z0-9_]+)", line)
                  if m:
                      res_key = m.group(1)
                      current = res_key if res_key.startswith("drawable/") else None
                      continue
                  if current and "(file)" in line:
                      fm = re.search(r"\(file\)\s+(\S+)", line)
                      if fm:
                          res_paths.setdefault(current, []).append(fm.group(1))
              emoji_names = sorted(
                  os.path.splitext(os.path.basename(p))[0]
                  for p in glob.glob("emoji/src/main/res/drawable-nodpi/*.png")
              )
              assert len(emoji_names) == 101, f"Expected 101 emoji PNGs, got {len(emoji_names)}"
              missing, stubbed = [], []
              for name in emoji_names:
                  paths = res_paths.get(f"drawable/{name}", [])
                  if not paths:
                      missing.append(name)
                  elif max(zf.getinfo(p).file_size for p in paths) <= 100:
                      stubbed.append(name)
              assert not missing and not stubbed, f"Emoji resource shrink check failed: missing={missing}, stubbed={stubbed}"
              print(f"OK all {len(emoji_names)} emoji drawables present and non-stubbed in release APK")
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: hipda/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: hipda/build/outputs/apk/release/hipda-ng-release.apk
          if-no-files-found: error

      - name: Upload smoke probe instrumentation APK
        uses: actions/upload-artifact@v7
        with:
          name: smoke-probe-apk
          path: baselineprofile/build/outputs/apk/nonMinifiedRelease/*.apk
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            hipda/build/reports/lint-results-debug.*
            emoji/build/reports/lint-results-debug.*
          if-no-files-found: warn

      - name: Summarize unit test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob("**/build/test-results/**/*.xml", recursive=True))
          if not files:
              print("No JUnit XML test result files found.")
              raise SystemExit(0)
          total_tests = total_fail = total_err = total_skip = parse_errors = 0
          print("=== Unit Test Summary (JUnit XML) ===")
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  parse_errors += 1
                  print(f"::warning file={path}::Failed to parse JUnit XML {path}: {exc}")
                  continue
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              for s in suites:
                  name = s.attrib.get("name", path)
                  tests = int(s.attrib.get("tests", 0))
                  failures = int(s.attrib.get("failures", 0))
                  errors = int(s.attrib.get("errors", 0))
                  skipped = int(s.attrib.get("skipped", 0))
                  passed = tests - failures - errors - skipped
                  total_tests += tests
                  total_fail += failures
                  total_err += errors
                  total_skip += skipped
                  print(f"  {name}: {tests} tests, {passed} passed, {failures} failed, {errors} errors, {skipped} skipped")
          total_pass = total_tests - total_fail - total_err - total_skip
          print(f"TOTAL: {total_tests} tests, {total_pass} passed, {total_fail} failed, {total_err} errors, {total_skip} skipped")
          if parse_errors:
              print(f"WARNINGS: skipped {parse_errors} malformed JUnit XML file(s)")
          PY

      - name: Upload unit test results and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn

  emulator-smoke:
    name: Emulator Smoke Test (API 36)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.emulator == true || inputs.emulator == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: debug-apk
          path: artifacts/debug

      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: artifacts/release

      - name: Download smoke probe instrumentation APK
        uses: actions/download-artifact@v8
        with:
          name: smoke-probe-apk
          path: artifacts/smoke-probe

      - name: Sign release APK with CI-only debug keystore
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          keytool -genkeypair -v \
            -keystore /tmp/ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 \
            artifacts/release/hipda-ng-release.apk \
            /tmp/hipda-ng-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks /tmp/ci-debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out artifacts/release/hipda-ng-release-signed.apk \
            /tmp/hipda-ng-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose artifacts/release/hipda-ng-release-signed.apk
          rm -f /tmp/ci-debug.keystore /tmp/hipda-ng-release-aligned.apk

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare smoke test script
        run: |
          cat <<'EOF' > /tmp/run-smoke.sh
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p smoke-artifacts

          # Keep emulator offline externally so neither debug nor release ever hits live 4d4y.com.
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb logcat -G 16M || true

          check_no_crash_or_anr() {
            local variant="$1"
            local log_file="$2"
            local failed=0
            if { grep -n -A 5 "FATAL EXCEPTION" "$log_file" || true; } | grep -q "net\.jejer\.hipda"; then
              echo "ERROR [$variant]: Found FATAL EXCEPTION for net.jejer.hipda in logcat!"
              grep -n -A 40 "FATAL EXCEPTION" "$log_file" || true
              failed=1
            fi
            if grep -n "ANR in net\.jejer\.hipda\.next" "$log_file"; then
              echo "ERROR [$variant]: Found ANR for net.jejer.hipda.next in logcat!"
              grep -n -A 20 "ANR in net\.jejer\.hipda\.next" "$log_file" || true
              failed=1
            fi
            return "$failed"
          }

          run_debug_smoke() {
            local apk_path="$1"
            echo "=== Smoke testing [debug]: $apk_path ==="
            test -f "$apk_path"
            adb uninstall net.jejer.hipda.next || true
            adb logcat -c
            adb install -r "$apk_path"
            adb shell am start -W -n net.jejer.hipda.next/net.jejer.hipda.feature.app.MainActivity
            sleep 10
            local log_file="smoke-artifacts/logcat-debug.txt"
            local png_file="smoke-artifacts/main-activity-debug.png"
            adb logcat -d > "$log_file"
            adb exec-out screencap -p > "$png_file"
            test -s "$png_file"
            check_no_crash_or_anr debug "$log_file"
            local pid
            pid=$(adb shell pidof net.jejer.hipda.next | tr -d '\r' || true)
            echo "[debug] App PID: ${pid:-<not running>}"
            test -n "$pid"
          }

          run_release_probe_smoke() {
            local apk_path="$1"
            local probe_apk="$2"
            echo "=== Smoke & Profile Probe testing [release]: $apk_path (probe=$probe_apk) ==="
            test -f "$apk_path"
            test -f "$probe_apk"

            adb uninstall net.jejer.hipda.next || true
            adb uninstall net.jejer.hipda.baselineprofile || true
            adb logcat -c
            adb install -r "$apk_path"
            adb install -r "$probe_apk"

            local instr_log="smoke-artifacts/instrumentation-release.log"
            set +e
            adb shell am instrument -w -r \
              -e class net.jejer.hipda.baselineprofile.ReleaseSmokeAndStartupProbeTest \
              net.jejer.hipda.baselineprofile/androidx.test.runner.AndroidJUnitRunner \
              | tee "$instr_log"
            local rc=${PIPESTATUS[0]}
            set -e

            adb logcat -d > smoke-artifacts/logcat-release.txt
            adb exec-out screencap -p > smoke-artifacts/main-activity-release.png
            adb pull /sdcard/Android/data/net.jejer.hipda.baselineprofile/files/smoke-artifacts/. smoke-artifacts/ || true
            ls -lh smoke-artifacts/

            if [ "$rc" -ne 0 ] || grep -q "FAILURES!!!" "$instr_log"; then
              echo "ERROR [release]: Instrumentation probe failed (rc=$rc)"
              cat "$instr_log"
              tail -n 120 smoke-artifacts/logcat-release.txt || true
              return 1
            fi

            check_no_crash_or_anr release smoke-artifacts/logcat-release.txt
            if grep -q "4d4y" smoke-artifacts/logcat-release.txt; then
              echo "INFO: checking 4d4y occurrences in release logcat:"
              grep -n "4d4y" smoke-artifacts/logcat-release.txt | head -n 30 || true
            fi
            test -s smoke-artifacts/startup-benchmark.txt
            echo "=== Release Startup Benchmark Summary ==="
            cat smoke-artifacts/startup-benchmark.txt
          }

          DEBUG_APK=$(find artifacts/debug -name "*.apk" | sort | awk 'NR==1{print}')
          RELEASE_APK="artifacts/release/hipda-ng-release-signed.apk"
          PROBE_APK=$(find artifacts/smoke-probe -name "*.apk" | sort | awk 'NR==1{print}')

          run_debug_smoke "$DEBUG_APK"
          run_release_probe_smoke "$RELEASE_APK" "$PROBE_APK"
          EOF
          chmod +x /tmp/run-smoke.sh

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: /tmp/run-smoke.sh

      - name: Upload emulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke-artifacts
          path: smoke-artifacts/
          if-no-files-found: warn

  generate-baseline-profile:
    name: Generate Baseline Profile (API 36)
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.generate_baseline_profile == true || inputs.generate_baseline_profile == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare Baseline Profile generation script
        run: |
          cat <<'EOF' > /tmp/run-baseline-profile.sh
          #!/usr/bin/env bash
          set -euo pipefail
          set +e
          ./gradlew :hipda:generateBaselineProfile --stacktrace
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "=== Connected AndroidTest XML Results ==="
            find baselineprofile/build/outputs/androidTest-results -name "*.xml" -print -exec cat {} + || true
            echo "=== Recent logcat (BaselineProfile / Benchmark / AndroidRuntime) ==="
            adb logcat -d -s BaselineProfile:V Benchmark:V AndroidRuntime:E TestRunner:V | tail -n 200 || true
            exit "$RC"
          fi
          EOF
          chmod +x /tmp/run-baseline-profile.sh

      - name: Generate Baseline Profile on API 36 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: /tmp/run-baseline-profile.sh

      - name: Verify generated Baseline Profile files
        run: |
          set -euo pipefail
          PROFILE_DIR="hipda/src/main/generated/baselineProfiles"
          ls -la "$PROFILE_DIR"
          test -s "$PROFILE_DIR/baseline-prof.txt"
          echo "=== baseline-prof.txt stats ==="
          wc -l "$PROFILE_DIR/baseline-prof.txt"
          grep -c "Lnet/jejer/hipda/" "$PROFILE_DIR/baseline-prof.txt" || true
          if grep -q "Lnet/jejer/hipda/baselineprofile/" "$PROFILE_DIR/baseline-prof.txt"; then
            echo "::error::Generated baseline-prof.txt must not include nonMinifiedRelease harness classes!"
            exit 1
          fi
          if [ -f "$PROFILE_DIR/startup-prof.txt" ]; then
            echo "=== startup-prof.txt stats ==="
            wc -l "$PROFILE_DIR/startup-prof.txt"
          fi

      - name: Upload generated Baseline Profile artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile-generated
          path: |
            hipda/src/main/generated/baselineProfiles/
            baselineprofile/build/outputs/connected_android_test_additional_output/
            baselineprofile/build/outputs/androidTest-results/
            baselineprofile/build/reports/androidTests/
          if-no-files-found: warn
